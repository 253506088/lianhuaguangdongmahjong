plugins { id 'com.android.application' }

android {
    namespace 'io.github.mahjong253506088.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.mahjong253506088.app'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions.unitTests.all {
        jvmArgs '-Dfile.encoding=UTF-8'
        // Gradle's Windows test-worker classpath loses non-ASCII paths on some
        // JDK 17 installations. Stage only those entries in a fresh ASCII temp
        // directory; source/build outputs stay in this checkout.
        if (System.getProperty('os.name').startsWith('Windows')) {
            doFirst {
                def staging = new File(System.getProperty('java.io.tmpdir'), 'mahjong-jvm-' + UUID.randomUUID())
                classpath = files(classpath.files.collect { entry ->
                    if (entry.absolutePath.chars().allMatch { it < 128 }) return entry
                    def destination = new File(staging, Integer.toHexString(entry.absolutePath.hashCode()))
                    if (entry.isDirectory()) { copy { from entry; into destination }; return destination }
                    copy { from entry; into destination }; return new File(destination, entry.name)
                })
            }
        }
    }
    signingConfigs {
        release {
            // Signing credentials belong in the environment or CI secrets.
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/gameAssets'))
}

tasks.register('syncGameAssets', Sync) {
    from '../../dist-android'
    into layout.buildDirectory.dir('generated/gameAssets/game')
    doFirst {
        if (!file('../../dist-android/index.html').isFile()) {
            throw new GradleException('Missing game assets. Run pnpm android:web from the repository root first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'syncGameAssets' }

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
