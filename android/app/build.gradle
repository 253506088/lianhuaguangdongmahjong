plugins { id 'com.android.application' }

android {
    namespace 'io.github.mahjong253506088.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.mahjong253506088.app'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '1.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            // Signing credentials belong in the environment or CI secrets.
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/gameAssets'))
}

tasks.register('syncGameAssets', Sync) {
    from '../../dist-android'
    into layout.buildDirectory.dir('generated/gameAssets/game')
    doFirst {
        if (!file('../../dist-android/index.html').isFile()) {
            throw new GradleException('Missing game assets. Run pnpm android:web from the repository root first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'syncGameAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
